name: Mac app

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save electron electron-builder
      - run: chmod +x "mac/Install Planty.command"

      - name: Build Planty for macOS
        run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach Mac builds to this release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.dmg
            dist/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
